services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: servicebase-postgres
    environment:
      POSTGRES_DB: servicebase
      POSTGRES_USER: servicebase
      POSTGRES_PASSWORD: servicebase
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servicebase -d servicebase']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
